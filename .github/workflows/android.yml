name: Compilar Rutas a Pie

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Permiso para Gradle
        run: chmod +x gradlew
      - name: Pruebas y APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintRelease
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RutasAPie-1.7.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
